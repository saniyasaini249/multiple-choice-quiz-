
<!DOCTYPE html>
<html>
<head>
<title>JavaScript Quiz</title>
<style>
body{font-family:Arial;background:#eef2f7;text-align:center;padding:40px}
.box{background:white;padding:25px;max-width:450px;margin:auto;border-radius:12px;box-shadow:0 3px 10px #aaa}
button{display:block;width:100%;padding:12px;margin:10px 0;background:#2878d0;color:white;border:0;border-radius:6px;cursor:pointer}
button:hover{background:#1456a0}
</style>
</head>
<body>

<div class="box">
<h2>JavaScript Quiz</h2>
<h3 id="question"></h3>
<div id="options"></div>
<p id="result"></p>
</div>

<script>
let quiz=[
{q:"Which keyword declares a variable?",o:["var","const","print","define"],a:"const"},
{q:"Which symbol is used for comments?",o:["//","**","##","&&"],a:"//"},
{q:"Which method prints output?",o:["write()","log()","show()","print()"],a:"log()"},
{q:"Which language runs in browser?",o:["Java","C++","JavaScript","Python"],a:"JavaScript"}
];

let i=0,score=0;

function show(){
if(i==quiz.length){
document.querySelector(".box").innerHTML=
"<h2>Quiz Completed!</h2><h3>Your Score: "+score+"/4</h3>";
return;
}
question.innerText="Q"+(i+1)+". "+quiz[i].q;
options.innerHTML="";
quiz[i].o.forEach(x=>{
let b=document.createElement("button");
b.innerText=x;
b.onclick=()=>{if(x==quiz[i].a)score++;i++;show();};
options.appendChild(b);
});
}
show();
</script>
</body>
</html>
